name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Validate bundled MusicXML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('samples/example.musicxml'); print('MusicXML sample is well-formed')"
